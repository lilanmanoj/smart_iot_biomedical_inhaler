; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; WiFi setup AP credentials used when device enters setup (AP) mode
; Replace the placeholders below or set at build time
build_flags =
	-D WIFI_SETUP_SSID=\"SETUP_SSID_PLACEHOLDER\"
	-D WIFI_SETUP_PASSWORD=\"SETUP_PASS_PLACEHOLDER\"
	-D FIREBASE_DATABASE_URL="https://example-project.firebaseio.com/"
	-D FIREBASE_API_KEY="EXAMPLE_API_KEY"
	-D FLOW_RATE_THRESHOLD=2.5
	-D PRESSURE_THRESHOLD=5.0
	-D PRESSURE_SENSOR_ENABLED=1

; Libraries: Firebase client + ArduinoJson (used by the Firebase client)
lib_deps =
	mobizt/Firebase-ESP-Client@^1.5.0
	bblanchon/ArduinoJson@^6.18.5

; You can add other libraries if you replace the pressure sensor driver
; with a vendor/sensor library (e.g., SparkFun MPRLS) and want to use
; proper MPRLS routines instead of the ADC placeholder in the sketch.
