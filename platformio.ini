; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; WiFi setup AP credentials used when the device enters setup (AP) mode
; These values are sourced from shell environment variables defined in .env
build_flags =
	-D WIFI_SETUP_SSID="${WIFI_SETUP_SSID}"
	-D WIFI_SETUP_PASSWORD="${WIFI_SETUP_PASSWORD}"
	-D FIREBASE_DATABASE_URL="${FIREBASE_DATABASE_URL}"
	-D FIREBASE_API_KEY="${FIREBASE_API_KEY}"
	-D FLOW_RATE_THRESHOLD=${FLOW_RATE_THRESHOLD}
	-D PRESSURE_THRESHOLD=${PRESSURE_THRESHOLD}
	-D PRESSURE_SENSOR_ENABLED=${PRESSURE_SENSOR_ENABLED}

; Libraries: Firebase client + ArduinoJson (used by the Firebase client)
lib_deps =
	mobizt/Firebase-ESP-Client@^1.5.0
	bblanchon/ArduinoJson@^6.18.5

; You can add other libraries if you replace the pressure sensor driver
; with a vendor/sensor library (e.g., SparkFun MPRLS) and want to use
; proper MPRLS routines instead of the ADC placeholder in the sketch.
