; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
name = smart-iot-biomedical-inhaler
description = "Smart IoT biomedical inhaler project with ESP32, Firebase, and Arduino framework"
default_envs = esp32-devkit-v1

[common]
; WiFi setup AP credentials used when the device enters setup (AP) mode
; These values are sourced from shell environment variables defined in .env
build_flags =
	-D WIFI_SETUP_SSID=\"${sysenv.WIFI_SETUP_SSID}\"
	-D WIFI_SETUP_PASSWORD=\"${sysenv.WIFI_SETUP_PASSWORD}\"
	-D FIREBASE_DATABASE_URL=\"${sysenv.FIREBASE_DATABASE_URL}\"
	-D FIREBASE_API_KEY=\"${sysenv.FIREBASE_API_KEY}\"
	-D FLOW_RATE_THRESHOLD=${sysenv.FLOW_RATE_THRESHOLD}
	-D PRESSURE_THRESHOLD=${sysenv.PRESSURE_THRESHOLD}
	-D PRESSURE_SENSOR_ENABLED=${sysenv.PRESSURE_SENSOR_ENABLED}

; Libraries: Firebase client + ArduinoJson (used by the Firebase client)
lib_deps =
	mobizt/FirebaseClient@^2.2.9
	bblanchon/ArduinoJson@^6.18.5

; FORCE PlatformIO to use the built-in ESP32 WebServer, not the ancient Ethernet one
lib_ignore = 
    Webduino

[env:esp32-devkit-v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-D FLOW_PIN=27
	-D PRESSURE_PIN=39
	-D LED_BLUE=33
	-D LED_GREEN=25
	-D LED_RED=32
lib_ignore = ${common.lib_ignore}
lib_deps = ${common.lib_deps}

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
build_flags =
	${common.build_flags}
	-D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
	-D FLOW_PIN=2
	-D PRESSURE_PIN=3
	-D LED_BLUE=4
	-D LED_GREEN=5
	-D LED_RED=6
lib_ignore = ${common.lib_ignore}
lib_deps = ${common.lib_deps}
